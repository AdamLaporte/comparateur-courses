<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Démarrage automatique des collecteurs</title>
<output id="rapport">Tests en cours</output>
<script type="module">
  const catalogue = await (await fetch("/app/drives/points_retrait.json")).json();
  Object.assign(catalogue, {
    "carrefour-retrait-136": { accueil: "https://www.carrefour.fr/set-store/136", reference: "136" },
    "carrefour-retrait-777": { accueil: "https://www.carrefour.fr/set-store/777", reference: "777" },
    "leclerc-retrait-095705": {
      accueil: "https://fd2-courses.leclercdrive.fr/magasin-095705-095705-stiring-wendel.aspx", reference: "095705",
    },
  });

  const accueilKerLann = catalogue["leclerc-retrait-113511"].accueil;
  let numeroScenario = 0;

  async function tester(dossier, commandes, erreurAttendue = "", adresseServeur, options = {}) {
    const { catalogueDejaOuvert, redirigerVersAccueil } = options;
    const evenement = () => ({ addListener() {} });
    const declencheurs = [];
    const session = {};
    const onglet = { id: 1, status: "complete", url: "about:blank" };
    const ouvertures = [];
    let clicsGayeulles = 0;
    let commande;
    let depot;
    let terminer;
    const enseigne = commandes[0].split("-")[0];
    const prixParPage = ["carrefour", "leclerc"].includes(enseigne);
    let documentOnglet = 1;
    Object.defineProperty(globalThis, "chrome", {
      configurable: true,
      value: {
        alarms: { get: async () => ({}), onAlarm: evenement() },
        runtime: {
          onStartup: { addListener: (fonction) => declencheurs.push(fonction) },
          onMessage: evenement(), onInstalled: evenement(),
        },
        webRequest: { onCompleted: evenement(), onErrorOccurred: evenement() },
        storage: {
          local: { get: async () => ({ jeton: "simulation", adresseServeur }) },
          session: {
            get: async () => ({ ...session }),
            set: async (valeurs) => Object.assign(session, valeurs),
            remove: async (cle) => delete session[cle],
          },
        },
        tabs: {
          create: async (options) => {
            if (options.active !== false) throw new Error("L’onglet doit s’ouvrir en arrière-plan");
            ouvertures.push("onglet");
            return onglet;
          },
          get: async () => onglet,
          query: async ({ url }) => catalogueDejaOuvert && url.endsWith("/magasin-113511-*")
            ? [{ id: 2, status: "complete", url: accueilKerLann }] : [],
          update: async (_id, { url }) => {
            ouvertures.push(url);
            documentOnglet++;
            const adresse = new URL(url);
            if (url === catalogue["intermarche-06994"].accueil) {
              onglet.url = url.replace("/rennes-", "/Rennes-") + "?pdvref=06994";
            } else if (adresse.searchParams.has("redirect")) {
              const chemin = redirigerVersAccueil ? "/courses" : adresse.searchParams.get("redirect");
              onglet.url = new URL(chemin, adresse.origin).href;
            } else {
              onglet.url = url;
            }
          },
          onRemoved: evenement(),
        },
        scripting: {
          executeScript: async ({ target, func, args = [] }) => {
            if (prixParPage) {
              const [requete] = args;
              const point = catalogue[commande];
              const prix = { produit: "Lait fictif", prix_eur: "1.20" };
              const adresse = target.tabId === 2 ? accueilKerLann : onglet.url;
              const surRecherche = new URL(adresse).searchParams.has(enseigne === "carrefour" ? "q" : "TexteRecherche");
              return [{
                documentId: String(documentOnglet),
                result: erreurAttendue === "defi" ? { erreur: "defi" } : {
                  reference: surRecherche && erreurAttendue === "mauvais_drive" ? "111111" : point.reference,
                  accueil: commande === "leclerc-retrait-113511" ? accueilKerLann : point.accueil,
                  document: documentOnglet,
                  recherche: surRecherche && requete === "lait",
                  charge: true,
                  items: surRecherche && requete ? [prix] : [],
                },
              }];
            }
            if (!args.length) return [{ result: ++clicsGayeulles > 1 }];
            const [adaptateur, requete, soumettre, [point] = []] = args;
            if (soumettre) onglet.url = new URL("?q=lait", onglet.url).href;
            const produit = { produit: "Lait fictif", prix_eur: "1.20" };
            const resultat = func.name === "extractProductPage" ? { items: [produit] }
              : erreurAttendue ? { erreur: erreurAttendue }
              : { retrait: point?.id === "06994" && clicsGayeulles < 2 ? "" : point?.id,
                document: requete && !soumettre ? 2 : 1,
                recherche: requete === "lait", charge: true, cartes: 1 };
            if (!adaptateur) throw new Error("Un adaptateur est requis");
            return [{ documentId: "test", result: resultat }];
          },
        },
      },
    });
    globalThis.fetch = async (url, options) => {
      if (new URL(url).origin !== (adresseServeur || "http://127.0.0.1:8000")
          || options.credentials !== "omit" || options.redirect !== "error") {
        terminer();
        return { ok: false };
      }
      if (url.endsWith("/prendre")) {
        if (!url.endsWith("/enseignes/" + enseigne + "/prendre")) {
          terminer();
          return { ok: false };
        }
        const point = catalogue[commande];
        return { ok: true, json: async () => ({
          id: 1, drive_id: commande, bail: "test", requete: "lait",
          point: { id: commande.slice(enseigne.length + 1), accueil: catalogueDejaOuvert
            ? "https://www.leclercdrive.fr/region-bretagne/bruz/drive-bruz---ker-lann.aspx" : point.accueil,
            libelles: point.libelles, reference: point.reference },
        }) };
      }
      depot = JSON.parse(options.body);
      terminer();
      return { ok: true };
    };
    await import("/extensions-edge/" + dossier + "/collecteur.js?scenario=" + ++numeroScenario);
    for (commande of commandes) {
      depot = null;
      const fini = new Promise((resolve) => { terminer = resolve; });
      declencheurs[0]();
      await fini;
      const accueil = catalogueDejaOuvert ? accueilKerLann : catalogue[commande].accueil;
      const ouvert = enseigne === "carrefour"
        ? ouvertures.some((url) => url.startsWith(accueil + "?") && new URL(url).searchParams.get("redirect") === "/s?q=lait")
        : ouvertures.includes(accueil);
      if (ouvertures[0] !== "onglet" || !ouvert) {
        throw new Error("Le bon point de retrait n’a pas été ouvert pour " + commande);
      }
      if (!depot || depot.drive_id !== commande || (erreurAttendue
          ? depot.erreur !== erreurAttendue || depot.produits
          : depot.etat !== "succes" || depot.service_observe !== commande.slice(enseigne.length + 1))) {
        throw new Error("Réponse du collecteur incorrecte pour " + commande);
      }
      await new Promise((resolve) => setTimeout(resolve, 0));
    }
    if (ouvertures.filter((x) => x === "onglet").length !== 1) throw new Error("Onglet non réutilisé");
  }

  const rapport = document.querySelector("#rapport");
  try {
    await tester("super-u-bruz", ["coursesu-33315", "coursesu-hyperu-guichen"]);
    await tester("intermarche-bruz-cap-vert", ["intermarche-05052"], "defi");
    await tester("intermarche-bruz-cap-vert", ["intermarche-05052", "intermarche-06994"],
      "", "https://comparateur-test.equipe.ts.net");
    await tester("carrefour", ["carrefour-retrait-136", "carrefour-retrait-777"]);
    await tester("carrefour", ["carrefour-retrait-267"], "", undefined, { redirigerVersAccueil: true });
    await tester("carrefour", ["carrefour-retrait-136"], "mauvais_drive", "https://comparateur-test.equipe.ts.net");
    await tester("leclerc", ["leclerc-retrait-095705"]);
    await tester("leclerc", ["leclerc-retrait-113511"]);
    await tester("leclerc", ["leclerc-retrait-113511"], "", undefined, { catalogueDejaOuvert: true });
    await tester("leclerc", ["leclerc-retrait-095705"], "defi", "https://comparateur-test.equipe.ts.net");
    rapport.textContent = "DRIVES_COLLECTEUR_OK";
  } catch (erreur) {
    rapport.textContent = "DRIVES_COLLECTEUR_ECHEC " + erreur.message;
  }
</script>
</html>
