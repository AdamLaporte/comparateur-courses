<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<title>Vérification des extracteurs Edge</title>
<output id="rapport">Tests en cours</output>
<header id="entete"></header>
<main id="resultats"></main>
<script type="application/json" id="etat-marchand"></script>
<script type="module">
  import { lirePage as lireU } from "/extensions-edge/super-u-bruz/navigation.js";
  import { lirePage as lireInter } from "/extensions-edge/intermarche-bruz-cap-vert/navigation.js";
  import { extractProductPage as extraireU } from "/extensions-edge/super-u-bruz/extract.js";
  import { extractProductPage as extraireInter } from "/extensions-edge/intermarche-bruz-cap-vert/extract.js";
  import { lirePage as lireCarrefour } from "/extensions-edge/carrefour/navigation.js";
  import { lirePage as lireLeclerc } from "/extensions-edge/leclerc/navigation.js";
  import { urlRecherche as rechercheCarrefour } from "/extensions-edge/carrefour/drive.js";
  import { urlRecherche as rechercheLeclerc } from "/extensions-edge/leclerc/drive.js";

  function verifier(condition, description) {
    if (!condition) throw new Error(description);
  }

  const entete = document.querySelector("#entete");
  const resultats = document.querySelector("#resultats");
  const etat = document.querySelector("#etat-marchand");
  const rapport = document.querySelector("#rapport");
  const bruzU = { id: "33315", libelles: ["Super U Bruz"] };
  const guichen = { id: "hyperu-guichen", reference: "36163", libelles: ["Hyper U Guichen"] };
  const bruzInter = { id: "05052", libelles: ["Bruz"] };
  const gayeulles = { id: "06994", libelles: ["Rennes", "Super Rennes"] };
  const lireRetraitU = (requete, soumettre = false, point = bruzU) =>
    lireU("u", requete, soumettre, [point]);
  const lireRetraitInter = (point = bruzInter) => lireInter("intermarche", "lait", false, [point]);

  window.addEventListener("load", tester, { once: true });

  function verifierCommerces() {
    const ean = "3276554163158";
    const reference = "0039-150-136";
    const offre = { attributes: {
      price: { price: 1.05, perUnit: 1.05, unitOfMeasure: "L" },
      promotions: [{ label: "Le 2e à −50 %" }],
    } };
    const offres = { [reference]: offre, "0039-100-333": { attributes: { price: { price: 0.45 } } } };
    const publierPrix = () => {
      const table = [];
      function indexer(valeur) {
        const i = table.push(null) - 1;
        if (Array.isArray(valeur)) table[i] = valeur.map(indexer);
        else if (typeof valeur === "object" && valeur !== null) {
          table[i] = Object.fromEntries(Object.entries(valeur).map(([cle, contenu]) => [cle, indexer(contenu)]));
        } else table[i] = valeur;
        return i;
      }
      indexer({ data: [{ attributes: { ean, title: "Lait demi-écrémé", brand: "Carrefour", offers: { [ean]: offres } } }] });
      etat.textContent = JSON.stringify({ routeData: JSON.stringify(table) });
    };
    history.replaceState(null, "", "/s?q=lait");
    entete.innerHTML = '<span data-store-name>Rennes Centre Alma</span>';
    resultats.innerHTML = '<h1>Résultats de recherche</h1><article class="product-list-card-plp-grid-new" data-testid="' + ean
      + '"><a data-testid="product-card-primary-link" href="/p/lait-' + ean + '">Lait</a>'
      + '<span class="product-list-card-plp-grid-new__meta--shimzone">1 L</span></article>';
    publierPrix();
    const carrefour = lireCarrefour("lait");
    const [lait] = carrefour.items;
    verifier(carrefour.reference === "136" && carrefour.recherche && carrefour.libelle === "Rennes Centre Alma"
      && new URL(carrefour.accueil).pathname === "/set-store/136", "Détection du Drive Carrefour");
    verifier(lait.ean === ean && lait.prix_eur === "1.05" && lait.prix_par_unite_eur === "1.05"
      && lait.format === "1 L" && lait.promos.includes("50 %") && lait.url.endsWith(ean), "Offre Carrefour du bon Drive");
    verifier(!lireCarrefour("pâtes").recherche, "Requête Carrefour différente");
    offres["0039-150-777"] = offre;
    publierPrix();
    verifier(!lireCarrefour("lait").items.length, "Deux références Drive Carrefour sont ambiguës");
    const carrefourCible = lireCarrefour("lait", "136");
    verifier(carrefourCible.reference === "136" && carrefourCible.items[0]?.prix_eur === "1.05"
      && !lireCarrefour("lait", "267").items.length, "Seuls les prix du Drive demandé sont relevés");
    delete offres["0039-150-777"];
    publierPrix();
    entete.innerHTML += '<button aria-selected="true">Livraison</button>';
    verifier(!lireCarrefour("lait").reference, "Livraison Carrefour refusée");
    verifier(new URL(rechercheCarrefour("https://www.carrefour.fr/set-store/136", "pâtes & riz")).searchParams.get("q")
      === "pâtes & riz", "Adresse de recherche Carrefour");
    const selection = new URL(rechercheCarrefour("https://www.carrefour.fr/set-store/267", "pâtes & riz", true));
    verifier(selection.pathname === "/set-store/267"
      && new URL(selection.searchParams.get("redirect"), selection.origin).searchParams.get("q") === "pâtes & riz",
      "La sélection Carrefour redirige vers la recherche demandée");

    const urlLeclerc = rechercheLeclerc("https://fd2-courses.leclercdrive.fr/magasin-095705-095705-stiring-wendel.aspx", "lait");
    const destinationLeclerc = new URL(urlLeclerc);
    history.replaceState(null, "", destinationLeclerc.pathname + destinationLeclerc.search);
    entete.innerHTML = "";
    resultats.innerHTML = '<ul><li class="liWCRS310_Product" data-ean="' + ean
      + '"><div class="pWCRS310_Desc"><p>Lait demi-écrémé</p><p>1 L</p></div>'
      + '<span class="pWCRS310_PrixUnitairePartieEntiere">1</span>'
      + '<span class="pWCRS310_PrixUnitairePartieDecimale">,25</span><span>1,25 €/L</span>'
      + '<img alt="Avantage fidélité"></li></ul>';
    const leclerc = lireLeclerc("lait");
    verifier(leclerc.reference === "095705" && leclerc.recherche && /stiring wendel/i.test(leclerc.libelle)
      && new URL(leclerc.accueil).pathname.endsWith("095705-095705-stiring-wendel.aspx")
      && destinationLeclerc.searchParams.get("TexteRecherche") === "lait", "Détection du Drive E.Leclerc");
    const [bouteille] = leclerc.items;
    verifier(bouteille.ean === ean && bouteille.prix_eur === "1.25" && bouteille.prix_par_unite_eur === "1.25"
      && bouteille.format === "1 L" && bouteille.promos === "Avantage fidélité", "Carte E.Leclerc et prix");
    history.replaceState(null, "", "/recherche.aspx?TexteRecherche=lait");
    verifier(!lireLeclerc("lait").items.length, "Un prix E.Leclerc sans magasin dans l'adresse est refusé");
    history.replaceState(null, "", destinationLeclerc.pathname + destinationLeclerc.search);
    resultats.innerHTML = "<p>Aucun produit trouvé pour cette recherche</p>";
    verifier(lireLeclerc("lait").vide, "Absence confirmée chez E.Leclerc");
    document.title = "Just a moment";
    verifier(lireCarrefour("lait").erreur === "defi" && lireLeclerc("lait").erreur === "defi", "Arrêt sur défi");
  }

  function tester() {
    try {
    history.replaceState(null, "", "?q=lait");
    entete.innerHTML = '<span>Super U Bruz</span><form role="search"><input type="search" name="q"></form>';
    const form = entete.querySelector("form");
    let valeurSoumise;
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      valeurSoumise = new FormData(form).get("q");
    });
    verifier(lireRetraitU("lait", true).retrait === "33315" && valeurSoumise === "lait", "Formulaire Super U");
    const cartes = Array.from({ length: 62 }, (_, i) => `
      <li data-tc-product-tile='{"name":"Lait fictif","EAN":"","brand":"Test","id":"${i}"}'>
        <a href="/p/lait/${i}.html">Lait</a><span data-item-price="1.25">1,25 €</span>
      </li>`).join("");
    resultats.innerHTML = `<ul id="search-result-items">${cartes}</ul>`;
    const pageU = lireRetraitU("lait");
    verifier(pageU.retrait === "33315" && pageU.recherche && pageU.cartes === 60, "Page de résultats Super U");
    verifier(!lireRetraitU("pâtes").recherche, "Requête différente chez Super U");
    const articlesU = extraireU("u", 60).items;
    verifier(articlesU.length === 60 && articlesU[0].prix_eur === "1.25", "Cartes et limite Super U");
    entete.firstElementChild.textContent = "Hyper U Guichen";
    verifier(lireRetraitU("lait").retrait === "", "Guichen ne doit pas être pris pour Bruz");
    verifier(lireRetraitU("lait", false, guichen).retrait === "hyperu-guichen", "Retrait Hyper U Guichen");
    const affecterMagasin = (id) => ["window.COOPU", "storeID"].join(".") + ' = "' + id + '"';
    etat.textContent = affecterMagasin("33315");
    verifier(lireRetraitU("lait", false, guichen).retrait === "", "Le numéro prime sur le libellé");
    entete.firstElementChild.hidden = true;
    etat.textContent = affecterMagasin("36163");
    verifier(lireRetraitU("lait", true, guichen).retrait === "hyperu-guichen", "Guichen en arrière-plan");
    verifier(lireU("u", "", false, [bruzU, guichen]).retrait === "hyperu-guichen",
      "Le relevé manuel retrouve Guichen dans le catalogue");
    etat.textContent += "; " + affecterMagasin("33315");
    verifier(!lireU("u", "", false, [bruzU, guichen]).retrait, "Sélection ambiguë refusée");

    history.replaceState(null, "", "/recherche/lait");
    entete.innerHTML = '<button id="headerStoreName">Bruz</button>';
    const hydrater = (ref) => {
      etat.textContent = 'self.__next_f.push([1,' + JSON.stringify(JSON.stringify({
        pdvRefFicheMagasin: ref,
      })) + '])';
    };
    hydrater("05052");
    resultats.innerHTML = `
      <div data-navigate-product-item><article data-testid="product-layout">
        <a href="/produit/lait/0304360041667">
          <span class="stime-product--details__title">Lait fictif</span>
          <div class="stime-product--details__summary"><p>Test</p></div>
          <span class="stime-product--details__packaging">6 × 1 L • 1,25 €/L</span>
        </a>
        <div class="stime-product--footer__prices"><span class="product--price">7,50 €</span></div>
        <span data-slot="sticker" aria-label="2e à −50 %">Promo</span>
      </article></div>`;
    const pageInter = lireRetraitInter();
    verifier(pageInter.retrait === "05052" && pageInter.recherche && pageInter.cartes === 1, "Page Intermarché");
    const [article] = extraireInter("intermarche", 60).items;
    verifier(article.ean === "0304360041667" && article.format === "6 × 1 L", "EAN et format Intermarché");
    verifier(article.prix_eur === "7.50" && article.prix_par_unite_eur === "1.25"
      && article.promos === "2e à −50 %", "Prix et condition Intermarché");
    hydrater("11111");
    verifier(lireRetraitInter().retrait !== "05052", "Bruz seul insuffisant");
    entete.querySelector("#headerStoreName").textContent = "Super Rennes";
    hydrater("06994");
    verifier(lireRetraitInter(gayeulles).retrait === "06994", "Retrait Rennes Gayeulles");
    verifier(lireInter("intermarche", "", false, [bruzInter, gayeulles]).retrait === "06994",
      "Le relevé manuel retrouve Rennes Gayeulles dans le catalogue");
    hydrater("06994_2");
    verifier(lireRetraitInter(gayeulles).retrait !== "06994", "Autre point de retrait à Rennes");
    history.replaceState(null, "", "/recherche/lait");
    entete.querySelector("#headerStoreName").textContent = "Bruz";
    hydrater("05052");
    resultats.innerHTML = "<p>Chargement en cours</p>";
    verifier(!lireRetraitInter().vide, "Un chargement ne confirme pas une absence");
    resultats.innerHTML = "<h1>Aucun produit trouvé pour cette recherche</h1>";
    verifier(lireRetraitInter().vide, "Absence confirmée");
    document.title = "Attention Required! | Cloudflare";
    verifier(lireRetraitInter().erreur === "defi", "Défi détecté");
    document.title = "Vérification des extracteurs Edge";
    verifierCommerces();
    rapport.textContent = "DRIVES_BROWSER_OK";
    } catch (erreur) {
      rapport.textContent = "DRIVES_BROWSER_ECHEC " + erreur.message;
    }
  }
</script>
</html>
