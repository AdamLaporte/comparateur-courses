{% extends "base.html" %}
{% block titre %}Créer un compte · GrignotePrix{% endblock %}
{% block contenu %}
<section class="carte">
  <h1>Créer un compte</h1>
  <p>Facultatif : votre liste actuelle sera gardée dans le compte.</p>
  {% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
  <form action="/comptes/inscription" method="post" class="formulaire">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required autofocus>
    <label for="mot_de_passe">Mot de passe (8 caractères au moins)</label>
    <input id="mot_de_passe" name="mot_de_passe" type="password" minlength="8" maxlength="128"
           autocomplete="new-password" required>
    <label for="confirmation">Confirmer le mot de passe</label>
    <input id="confirmation" name="confirmation" type="password" minlength="8" maxlength="128"
           autocomplete="new-password" required>
    <button type="submit" class="principal">Créer mon compte</button>
  </form>
  <p>Déjà un compte ? <a href="/comptes/connexion">Se connecter</a></p>
</section>
{% endblock %}
